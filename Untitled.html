<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <title>Anshu(love)</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #f0f0f0;
                font-family: Arial, sans-serif;
            }

            .container {
                text-align: center;
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                background: #ff6f61;
                color: white;
                border: none;
                border-radius: 5px;
                transition: background 0.3s ease-out;
            }

            button:hover {
                background: #ff3b2f;
            }

            .hidden {
                display: none;
            }

            #Heartcontainer {
                margin-top: 10px;
                animation: fadein 2s ease-in-out;
            }

            .heart {
                position: relative;
                width: 100px;
                height: 90px;
                background: red;
                margin: 0 auto;
                transform: rotate(-45deg);
            }

            .heart::before,
            .heart::after {
                content: '';
                position: absolute;
                width: 100px;
                height: 90px;
                border-radius: 50%;
                background: red;
            }

            .heart::before {
                top: -50px;
                left: 0;
            }

            .heart::after {
                top: 0;
                left: 50px;
            }

            .heart p {
                transform: rotate(45deg);
                position: relative;
                top: 110px;
                font-size: 14px;
                color: rgb(106, 25, 219);
                text-align: center;
                align-items: center;
            }

            @keyframes fadein {
                0% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }
            .main-container {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                padding: 10px;
            }
            .item{
                width: 30%;
            }
            .item img{
                width: 100px;
                height: 200px;
                border-radius: 10px;
            }
            @media(max-width:767px){
                .item{
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Click the button to see my feelings for you</h1>
            <button id="loveButton">Click Me</button>
            <div id="Heartcontainer" class="hidden">
                <br>
                    <br>
                    <br>
                    <br>
                   
                   
                <div class="heart">
                    <p>I Love you in Every Universe. </p>
                </div>
            </div>
             <br>
             <br>
             <br>
        <div class=" main-container">
            <div class="item">
                <img src="C:\Users\straw\OneDrive\Documents\WhatsApp Image 2024-07-30 at 18.48.35_487013fd.jpg">
                <h2>She is My Love</h2>
            </div>
            </div>
        <script>
            document.getElementById('loveButton').addEventListener('click', function() {
                document.getElementById('Heartcontainer').classList.toggle('hidden');
                document.getElementById('main-container').classList.toggle('hidden');
            });
        </script>
    </body>
</html>
