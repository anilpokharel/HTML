<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel Fast</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https:://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"></link>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-css@3.0.1/dist/emoji.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simple-line-icon/2.5.5/css/simple-line-icon.min.css">
    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: white;
            min-height: 100vh;
            font-family:"inter",Arial ;
            align-items: center;
            background: linear-gradient(123deg,rgba(18,159,167,0.358),0%,#deaed4,100%);

        }
        header {
            background-color: white;
            height: 60px;
            display: flex;
            align-items: center;
        }
        .dp {
            height: 40px;
            width: 40px;
            background-image:url("babe.jpg");
            background-color: rgb(12, 12, 12);
            border-radius: 50%;
            margin: 10px;
        }
        hr {
            border: 1px solid black;
            margin: 0;
        }
        .today {
            font-size: 10px;
            font-weight: bold;
            color: gray;
            text-align: center;
            margin: 10px 0px;
        }
        .name {
            font-weight: bold;
            flex: 1;
            margin-left: 10px;
        }
        .call, .video, .back {
            width: 30px;
            height: 30px;
            background-color: lightgray;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            outline: none;
            cursor: pointer;
            border: 0;
            padding: 9px 20px 9px 12px;
            border-radius: 11px;
            line-height: 24px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            color: var(--text);
        }
        .fa-phone, .fa-video, .fa-chevron-right {
            font-size: 16px;
        }
        footer {
            height: 60px;
            top: 425px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-top: 1px solid lightgray;
        }
        input {
            height: 35px;
            flex: 1;
            border-radius: 20px;
            background-color: lightgray;
            padding: 7px 10px;
            border: none;
            margin: 0 10px;
        }
        .plus, .fa-microphone, .fa-smile, .fa-file-image, .fa-paper-plane {
            font-size: 20px;
            color: black;
        }
        .plus{
        width: 35px;
        height: 35px;
        position: relative;
        left: 1px;
        top: 0px;
        border-radius: 18px;
        background-color: lightgray;
        padding: 10px;
    }
    .fa-camera {
    position: relative;
    font-size: 23px;
    top: -4px;
    left: -3px;
    }
    .fa-smile{
        position: relative;
        font-size: 23px;
        top: 13px;
        left: 47px;
    }
    .fa-file-image{
        position: relative;
        font-size: 23px;
    }
    .fa-paper-plane{
        position: relative;
        font-size: 23px;
        top: 13px;
        left: 60px;
    }
    .url{
        color: blue;
        text-decoration: underline;
        cursor: pointer;
        margin-left: 10px;
        font-size: 12px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 100px;
        text-align: center;
        transition: color 0.2s ease-in-out;
    }
     a{
        text-decoration: none;
        font-family: sans-serif;
        text-transform: lowercase;
        font-size: 1.5em;
        color: #222;
     }
     .menu{
        display: flex;
        justify-content: space-around;
        align-items: center;
        position: relative;
        width: 500px;
        height: 60px;
        padding: 0 15px 15px;
        border-radius: 10px 10px 30px 30px;
        background-color: #fff;
        box-shadow: 0px 18px 0px #9f9f9f;
        margin: 10px;
     }
      .menu.nav-item{
        position: relative;
      }
      .menu.nav-item.tab-table{
        display: none;
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translate(-50%,0%);
        font-size: 12px;
        background: #222;
        color: #fff;
        padding: 5px;
        border-radius: 5px;
        width: max-content;
        text-transform: capitalize;
      }
      .menu.nav-item.tab-table:before{
        position: absolute;
        border-color: #222 transparent transparent transparent;
        border-style: solid;
        border-width: 6px;
        width: 0px;
        height: 0px;
        bottom: -12px;
        left: 50%;
        transform: translate(50%,0%);
      }
      .menu.nav-item:hover{
        display: block;
      }
      .menu.checkbox{
        background-color: #fff;
        cursor: pointer;
        width: 0;
        height: 0;
        position: relative;
        z-index: index 1;
      }
      .menu.checkbox::before{
        width: 80px;
        aspect-ratio:1 ;
        transform: translate(-50%,-50%);
        top: -30px;
        left: 0px;
        position: absolute;
        border-radius: 100%;
        background-color: #ea4682;
        transition: all 0.2s linear;
        border: 4px solid #fff;
      }
      .menu.checkbox::after{
        position: absolute;
        
      }
    </style>
</head>
<body>
    <header>
        <div class="dp" url="C:\Users\straw\OneDrive\Documents"></div>
        <div class="name">Anshu</div>
        <div class="call"><i class="fa fa-phone" aria-hidden="true"></i></div>
        <div class="video"><i class="fa fa-video" aria-hidden="true"></i></div>
        <div class="back"><i class="fa fa-chevron-right" aria-hidden="true"></i></div>
    </header>
    <hr>
    <div class="today">Today</div>
    <footer>
        <div class="plus"><i class="fa fa-camera" aria-hidden="true"></i></div>
        <input placeholder="chat" type="text"/>
        <i class="fa fa-microphone" aria-hidden="true"></i>
        <i class="fa fa-smile" aria-hidden="true"></i>
        <i class="fa fa-file-image" aria-hidden="true"></i>
        <i class="fa fa-paper-plane" aria-hidden="true"></i>
    </footer>
    <nav class="menu">
        <a class="nav-items" href="#"><i class="icons-home icons"></i><span class="tab-title">Home</span></a>
        <input type="checkbox" name="" class="checkbox">
        <div class="checkbox-list">
            <a class="nav-item" href="#"><i class="icon-magnifier icons"></i><span class="tab-title">Search</span></a>
            <a class="nav-item" href="#"><i class="icon-bell icons"></i><span class="tab-title">Notifaction</span></a>
            <a class="nav-item" href="#"><i class="icon-heart icons"></i><span class="tab-title">Favourite</span></a>
            <a class="nav-item" href="#"><i class="icons-user icon"><span class="tab-title">Your Porfile</span></i></a>
        </div>
    </nav>
</body>
<script>

</script>
</html>
